name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      API_KEY: payflow-ci-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Unit tests
        run: uv run --no-sync pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, RabbitMQ, API and consumer
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Verify API, queues and webhooks
        run: docker compose exec -T api python scripts/smoke.py
      - name: Verify dashboard demo scenarios
        run: docker compose exec -T api python scripts/demo_smoke.py
      - name: Verify persistence after restarting every service
        run: |
          docker compose restart postgres rabbitmq api consumer
          docker compose up -d --no-recreate --wait --wait-timeout 180
          docker compose exec -T api python scripts/smoke.py --verify-only
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name and version
        id: image
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          name = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"name={name}\nversion={version}\n")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Payflow
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
